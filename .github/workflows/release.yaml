name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  version:
    name: Verify tag matches Cargo.toml version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo pkgid | sed 's/.*[#@]//')"
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag version ($tag) differs from Cargo.toml version ($crate). Bump version in Cargo.toml before tagging."
            exit 1
          fi

  test:
    name: CI checks
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
      checks: write

  build:
    name: Build packages
    needs:
      - version
      - test

    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Clean Zig cache
        run: rm -rf .zig-cache

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish
        env:
          CARGO_HOME: /home/runner/.cargo
          CARGO_INCREMENTAL: 0
          CARGO_TERM_COLOR: always
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local-cache

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.rpm
            dist/*.deb
            dist/*.tar.gz
            dist/checksums.txt

      - name: Upload unsigned packages
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-linux-packages
          path: |
            dist/*.rpm
            dist/*.deb
          if-no-files-found: error

  release:
    name: Sign and publish packages
    needs: build
    permissions:
      id-token: write
      contents: read
    uses: PoschLabs/release-packages/.github/workflows/release.yml@v1
    with:
      server-url: ${{ vars.PACKAGE_SERVER_URL }}
      artifact-name: unsigned-linux-packages
    secrets:
      server-username: ${{ secrets.PACKAGE_SERVER_USERNAME }}
      server-password: ${{ secrets.PACKAGE_SERVER_PASSWORD }}
