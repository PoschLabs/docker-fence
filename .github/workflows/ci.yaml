name: CI

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Audit Cargo.lock against the RustSec advisory database
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  lint-test:
    name: Format, lint and unit tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --locked

  integration:
    name: Integration tests (netns)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y iptables iproute2 procps curl python3
      - name: Record iptables backend
        run: iptables --version
      - name: Integration tests (network namespaces)
        run: sudo env "PATH=$PATH" "HOME=$HOME" cargo test --test netns -- --ignored --test-threads=1

  rocky9:
    name: Integration tests (Rocky Linux 9)
    runs-on: ubuntu-26.04
    continue-on-error: true
    container:
      image: rockylinux:9
      options: --privileged
    steps:
      - name: Install system packages
        run: dnf install -y --allowerasing iptables iproute procps-ng curl python3 gcc git tar
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Record iptables backend
        run: iptables --version
      - name: Integration tests (network namespaces)
        # The container runs as root and has no sudo.
        run: env "PATH=$PATH" cargo test --test netns -- --ignored --test-threads=1
