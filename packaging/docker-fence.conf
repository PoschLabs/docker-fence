# docker-fence configuration
#
# One entry per line:
#
#   block <network>   containers may not open NEW connections to <network>
#   allow <network>   exception: containers may still reach <network>
#
# <network> is a CIDR such as 192.0.2.0/24 or 2001:db8:10::/64, or a single
# host such as 192.0.2.10 (the same as 192.0.2.10/32). IPv4 and IPv6 entries
# may be mixed. The keywords are lowercase; an entry without one is an error.
#
# Blank lines are ignored, and '#' starts a comment (on its own line or after
# an entry).
#
# Replies on connections that were started from a blocked network are always
# allowed. When entries overlap, the most specific one (longest prefix) wins,
# so an 'allow' only has an effect inside a larger 'block'. Listing the same
# network as both 'block' and 'allow' is an error.
#
# With no 'block' entries, docker-fence blocks nothing.
#
# Examples (documentation ranges; replace with your own networks):
#
# block 192.0.2.0/24            # management network
# allow 192.0.2.10/32           # ... except the jump host
# block 2001:db8:10::/64        # storage network (IPv6)
