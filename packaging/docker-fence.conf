# docker-fence configuration
#
# One allowed source network per line, in CIDR notation. IPv4 and IPv6
# networks may be mixed. Blank lines are ignored, and '#' starts a comment
# (on its own line or after an entry).
#
# Only these sources may reach ports published by Docker containers.
# With no entries, docker-fence blocks all external access to published ports.
#
# Examples (documentation ranges; replace with your own networks):
#
# 192.0.2.0/24
# 2001:db8:10::/64
