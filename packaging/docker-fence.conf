# docker-fence configuration
#
# One network per line, in CIDR notation. IPv4 and IPv6 networks may be
# mixed. Blank lines are ignored, and '#' starts a comment (on its own line
# or after an entry).
#
# Docker containers are blocked from opening NEW connections to these
# networks. Replies on connections started from them are still allowed.
# With no entries, docker-fence blocks nothing.
#
# Examples (documentation ranges; replace with your own networks):
#
# 192.0.2.0/24
# 2001:db8:10::/64
