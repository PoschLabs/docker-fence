[package]
name = "docker-fence"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Block Docker containers from opening new connections to listed networks"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
ipnet = "2"
log = "0.4.35"
